name: Docusaurus site

on:
  push:
    branches: [site-rework]
    paths: &doc_paths
      - 'pallets/xp/docs/**'
      - 'pallets/commitment/docs/**'
      - 'pallets/authors/docs/**'
      - 'pallets/chain-manager/docs/**'
  pull_request:
    branches: [site-rework]
    paths: *doc_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.name }} docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: pallet-xp,            dir: pallets/xp/docs }
          - { name: pallet-commitment,    dir: pallets/commitment/docs }
          - { name: pallet-authors,       dir: pallets/authors/docs }
          - { name: pallet-chain-manager, dir: pallets/chain-manager/docs }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Build Docusaurus
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}  
          path: ${{ matrix.dir }}/build
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/site-rework'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all site builds
        uses: actions/download-artifact@v4
        with:
          pattern: pallet-*
          path: site   

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false